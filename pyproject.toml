[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracyn"
version = "1.0.0"
description = "TRACYN — Intelligent Cyber Defence, File Integrity & Threat Detection Platform"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alinshan", email = "alinshan2255@gmail.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.0.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "pydantic>=2.0.0",
    "requests>=2.30.0"
]

[project.scripts]
tracyn = "tracyn.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]
